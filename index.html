<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Video Rating</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <video loop controls width="500" height="400">
        <source src="taghazzum.mp4" type="video/mp4">
    </video>
    <form action="">
        <div>
            <label for="rate_video">Rate the video</label>
            <input type="number" id="rate_video" name="rate_video" min="1" max="5" title="Numeric video rating">
        </div>
        <div>
            <label for="rating">Rate the video</label>
            <input type="range" id="rating" name="rating" min="1" max="5" value="1"
                oninput="this.nextElementSibling.value=this.value">
            <output>1</output>

            <datalist for="rating">
                <option value="1"></option>
                <option value="2"></option>
                <option value="3"></option>
                <option value="4"></option>
                <option value="5"></option>

            </datalist>
        </div>
        <button type="submit">Submit rating</button>
    </form>
</body>

</html>
